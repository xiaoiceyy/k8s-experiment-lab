apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: java-demo
  name: java-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-demo
  strategy: {}
  template:
    metadata:
      labels:
        app: java-demo
    spec:
      containers:
      - image: 192.168.187.128:30080/java-demo/java-demo:v1
        name: java-demo
        volumeMounts:
        - name: config
          mountPath: /usr/local/tomcat/webapps/ROOT/WEB-INF/classes/application.yml
          subPath: application.yml
      volumes:
      - name: config
        configMap:
          name: java-demo-config
          items:
          - key: application.yml
            path: application.yml       
